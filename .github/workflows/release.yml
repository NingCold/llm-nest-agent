name: Agent artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 4
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: |
          python scripts/release.py
          python scripts/check-boundaries.py
          python scripts/test_package_agent.py
          cargo test --workspace --locked
          cargo build -p agent-node --bin llmn-agent --release --target ${{ matrix.target }} --locked
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python scripts/package-agent.py --binary target/${{ matrix.target }}/release/llmn-agent${{ matrix.suffix }} --output agent-artifacts --version "$version" --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.target }}
          path: agent-artifacts/*
          if-no-files-found: error
          retention-days: 14
