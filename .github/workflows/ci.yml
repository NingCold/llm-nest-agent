name: Agent checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: |
          python scripts/check-boundaries.py
          python scripts/test_package_agent.py
          cargo fmt --all -- --check
          cargo build --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked
          python scripts/test_clean_build_artifacts.py
