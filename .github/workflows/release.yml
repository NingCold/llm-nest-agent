name: Agent artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<Agent version> tag; empty builds temporary acceptance artifacts only'
        required: false
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and exact checked out tag
        run: python scripts/release.py
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: |
          python scripts/check-boundaries.py
          python scripts/test_package_agent.py
          python scripts/test_merge_agent_artifacts.py
          cargo test --workspace --locked
          cargo build -p agent-node --bin llmn-agent --release --target ${{ matrix.target }} --locked
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python scripts/package-agent.py --binary target/${{ matrix.target }}/release/llmn-agent${{ matrix.suffix }} --output agent-artifacts --version "$version" --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.target }}
          path: agent-artifacts/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          path: platform-artifacts
      - name: Assemble verified dual-platform manifest and SHA-256 list
        run: |
          python scripts/release.py
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--release-tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"); fi
          python scripts/merge-agent-artifacts.py --inputs platform-artifacts --output release-assets "${args[@]}"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'Temporary acceptance artifacts only; no published URLs or Release were created.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Fixed-tag URLs become downloadable only after the maintainer publishes the draft Release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-release-assets
          path: release-assets
      - name: Create or update draft for the verified existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          独立 LLM-Nest Agent 程序：Windows x64 与 Linux x64。

          agent-manifest.json 同时记录两平台的固定 tag 下载地址与 SHA-256；SHA256SUMS.txt 覆盖程序和清单。
          产物不包含节点数据、模型 Key、凭据或恢复材料。固定地址须在本草稿公开后才可下载。
          维护者请核对平台验收、许可证及第三方声明后手动公开；此流程不自动发布或创建 tag。
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            if [[ "$(cat is-draft.txt)" != true ]]; then
              echo 'Refusing to replace an already published Release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft "${flags[@]}" --title "LLM-Nest Agent $RELEASE_TAG" --notes-file release-notes.md
          fi
